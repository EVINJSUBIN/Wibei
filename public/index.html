<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wibei - 3D WebGL Music Visualizer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js and Post-processing dependencies -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <!-- Background Layers -->
    <canvas id="bg-canvas"></canvas>
    <div id="threejs-container"></div>

    <!-- Top Left Controls -->
    <div class="top-nav">
        <button class="glass-btn back-btn" id="back-btn" title="Reset View">← Back</button>
        
        <div class="glass-select-group">
            <span class="label">STYLE</span>
            <select id="vis-sel" class="glass-select">
                <option value="pulse">Pulse Ring</option>
                <option value="wave">Wave</option>
                <option value="grid">Grid</option>
            </select>
        </div>

        <div class="glass-select-group">
            <span class="label">BG</span>
            <select id="bg-sel" class="glass-select">
                <option value="synth">Synth Grid</option>
                <option value="none">None</option>
            </select>
        </div>

        <div class="glass-select-group">
            <span class="label">THEME</span>
            <select id="theme-sel" class="glass-select">
                <option value="gold">Gold</option>
                <option value="cyan">Cyan</option>
                <option value="magenta">Magenta</option>
            </select>
        </div>

        <button class="glass-btn logs-btn" id="logs-btn" title="Toggle System Logs">
            <span class="icon green-dot"></span> Logs
        </button>
    </div>

    <!-- Floating Logs Panel -->
    <div id="logs-panel" class="glass-panel" style="display: none; position: absolute; top: 76px; left: 24px; width: 320px; height: 380px; overflow-y: auto; padding: 14px; font-size: 11px; z-index: 25; color: #a1a1aa; border-radius: 12px;">
        <div style="font-weight: 600; margin-bottom: 10px; color: #fff; display: flex; justify-content: space-between; align-items: center;">
            <span>System Logs</span>
            <span style="font-size: 9px; color: #71717a; text-transform: uppercase;">Live</span>
        </div>
        <div id="logs-content" style="display: flex; flex-direction: column; gap: 4px;"></div>
    </div>

    <!-- Bottom Player Bar -->
    <div class="player-container">
        <div class="player-pill glass-panel">
            <div class="track-info">
                <img id="album-art" src="favicon.svg" alt="Album Art">
                <div class="track-text">
                    <div id="track-title" class="title">Ready to Play</div>
                    <div id="track-artist" class="artist">Search or upload a song</div>
                </div>
            </div>

            <div class="controls">
                <button id="play-btn" class="ctrl-btn play-icon" title="Play / Pause">▶</button>
                <span id="time-current" class="time">0:00</span>
                <div class="progress-bar">
                    <input type="range" id="seek-slider" value="0" min="0" max="100" step="0.1">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
                <span id="time-total" class="time">0:00</span>
                
                <div class="volume-control">
                    <span class="vol-icon" title="Volume">🔊</span>
                    <input type="range" id="vol-slider" value="100" min="0" max="100">
                </div>
            </div>

            <div class="search-box">
                <button id="mic-btn" class="search-icon" title="Microphone Input">🎤</button>
                <button id="upload-btn" class="search-icon" title="Upload Local Audio">📁</button>
                <input type="file" id="file-upload" accept="audio/*" style="display: none;">
                <input type="text" id="search-inp" placeholder="Change song..." autocomplete="off">
                <button id="search-btn" class="search-icon" title="Search">🔍</button>
                
                <!-- Suggestions Dropdown -->
                <div id="suggestions-box" class="glass-panel"></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
