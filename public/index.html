<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wibei // 3d music visualizer</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    
    <!-- Three.js + Postprocessing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
</head>
<body>
    <!-- Background Canvas + Three.js Container -->
    <canvas id="bg-canvas"></canvas>
    <div id="threejs-container"></div>

    <!-- Top Header Bar -->
    <header class="app-header">
        <div class="brand">
            <span class="brand-dot"></span>
            <span class="brand-name">wibei</span>
            <span class="brand-tag">v1.0</span>
        </div>

        <!-- Mode Selectors (Segmented Buttons) -->
        <div class="header-controls">
            <div class="control-pill">
                <span class="pill-label">STYLE</span>
                <div class="segmented-group" id="style-segmented">
                    <button class="seg-btn active" data-value="pulse">Ring</button>
                    <button class="seg-btn" data-value="wave">Wave</button>
                    <button class="seg-btn" data-value="grid">Grid</button>
                </div>
            </div>

            <div class="control-pill">
                <span class="pill-label">GRID</span>
                <button class="toggle-chip active" id="bg-grid-toggle">Synth Grid</button>
            </div>

            <div class="control-pill">
                <span class="pill-label">THEME</span>
                <div class="theme-picker">
                    <button class="color-dot dot-gold active" data-theme="gold" title="Gold Neon"></button>
                    <button class="color-dot dot-cyan" data-theme="cyan" title="Cyber Cyan"></button>
                    <button class="color-dot dot-magenta" data-theme="magenta" title="Neon Pink"></button>
                </div>
            </div>
        </div>

        <!-- Right Action Tools -->
        <div class="header-actions">
            <button class="action-btn" id="reset-cam-btn" title="Reset 3D View (R)">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                <span>Reset View</span>
            </button>
            <button class="action-btn" id="shortcuts-btn" title="Keyboard Shortcuts">
                <span class="kbd-badge">?</span>
            </button>
        </div>
    </header>

    <!-- Quick Demo Songs Bar (For fast reviewing & testing) -->
    <div class="quick-demos-bar">
        <span class="demo-tag">Quick Play:</span>
        <button class="demo-chip" data-query="Lofi Girl - beats to relax/study to">☕ Lofi Beats</button>
        <button class="demo-chip" data-query="Synthwave Radio - chill synth / retro beats">🌃 Synthwave</button>
        <button class="demo-chip" data-query="JVKE - golden hour (official audio)">✨ Golden Hour</button>
    </div>

    <!-- Keyboard Shortcuts Modal -->
    <div class="modal-overlay" id="shortcuts-modal" style="display: none;">
        <div class="modal-card glass-card">
            <div class="modal-header">
                <h3>Keyboard Shortcuts</h3>
                <button class="close-modal-btn" id="close-modal-btn">&times;</button>
            </div>
            <div class="shortcuts-grid">
                <div class="shortcut-row"><kbd>Space</kbd> <span>Play / Pause</span></div>
                <div class="shortcut-row"><kbd>M</kbd> <span>Mute / Unmute</span></div>
                <div class="shortcut-row"><kbd>1 / 2 / 3</kbd> <span>Switch Visualizer Style</span></div>
                <div class="shortcut-row"><kbd>R</kbd> <span>Reset 3D Camera Angle</span></div>
                <div class="shortcut-row"><kbd>F</kbd> <span>Toggle Fullscreen</span></div>
                <div class="shortcut-row"><kbd>Drag</kbd> <span>Rotate visualizer in 3D</span></div>
            </div>
        </div>
    </div>

    <!-- Bottom Audio Player -->
    <footer class="player-wrapper">
        <div class="player-bar glass-card">
            <!-- Left: Artwork & Metadata -->
            <div class="now-playing">
                <div class="art-container">
                    <img id="album-art" src="favicon.svg" alt="Track Art">
                    <div class="art-pulse-ring"></div>
                </div>
                <div class="meta-container">
                    <div id="track-title" class="track-name">Ready to play</div>
                    <div id="track-artist" class="artist-name">Search or pick a demo track</div>
                </div>
            </div>

            <!-- Middle: Main Transport & Scrubber -->
            <div class="player-center">
                <div class="transport-row">
                    <button id="play-btn" class="main-play-btn" title="Play / Pause (Space)">
                        <svg class="icon-play" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                        <svg class="icon-pause" style="display:none;" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
                    </button>
                    
                    <span id="time-current" class="time-label">0:00</span>
                    
                    <div class="seek-track" id="seek-container">
                        <div class="seek-progress" id="progress-fill"></div>
                        <input type="range" id="seek-slider" min="0" max="100" step="0.1" value="0">
                    </div>
                    
                    <span id="time-total" class="time-label">0:00</span>
                </div>
            </div>

            <!-- Right: Volume, Inputs & YouTube Search -->
            <div class="player-tools">
                <!-- Volume Slider -->
                <div class="volume-box">
                    <button class="tool-btn" id="mute-btn" title="Mute (M)">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>
                    </button>
                    <div class="volume-slider-wrap">
                        <input type="range" id="vol-slider" min="0" max="100" value="100">
                    </div>
                </div>

                <div class="tool-divider"></div>

                <!-- Mic Input -->
                <button class="tool-btn" id="mic-btn" title="Use Live Microphone Input">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
                </button>

                <!-- Local File Upload -->
                <button class="tool-btn" id="upload-btn" title="Upload Local Audio File (.mp3, .wav)">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                </button>
                <input type="file" id="file-upload" accept="audio/*" style="display: none;">

                <!-- Search Input Box -->
                <div class="search-wrap">
                    <svg class="search-lead-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    <input type="text" id="search-inp" placeholder="Search track or artist..." autocomplete="off">
                    <button class="search-submit-btn" id="search-btn" title="Search">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
                    </button>

                    <!-- Real-time YouTube Suggestions Dropdown -->
                    <div class="suggestions-flyout glass-card" id="suggestions-box" style="display: none;"></div>
                </div>
            </div>
        </div>
    </footer>

    <!-- Status Pill in Bottom Left -->
    <div class="status-indicator">
        <span class="status-dot"></span>
        <span id="status-text">Ready // WebGL 60 FPS</span>
    </div>

    <script src="app.js"></script>
</body>
</html>
