<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ambientBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#031018"/>
      <stop offset="50%" stop-color="#0a2838"/>
      <stop offset="100%" stop-color="#020b12"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="ambientGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#ambientBg)"/>

  <path d="M-20,240 Q80,180 180,230 T380,210 T530,250 L530,400 L-20,400 Z" fill="url(#aurora)" opacity="0.2" filter="url(#ambientGlow)"/>
  <path d="M-20,270 Q120,220 250,260 T480,240 T530,290 L530,400 L-20,400 Z" fill="url(#aurora)" opacity="0.25" filter="url(#ambientGlow)"/>

  <g transform="translate(256, 220)" filter="url(#ambientGlow)">
    <circle cx="0" cy="0" r="90" fill="none" stroke="url(#ringGrad)" stroke-width="1.8" opacity="0.8"/>
    <ellipse cx="0" cy="0" rx="115" ry="40" fill="none" stroke="#38bdf8" stroke-width="1.5" transform="rotate(-30)" opacity="0.65"/>
    <ellipse cx="0" cy="0" rx="115" ry="40" fill="none" stroke="#10b981" stroke-width="1.5" transform="rotate(30)" opacity="0.65"/>
    <circle cx="0" cy="0" r="12" fill="#67e8f9"/>
    <circle cx="0" cy="0" r="24" fill="#38bdf8" opacity="0.35"/>
  </g>

  <g fill="#38bdf8" opacity="0.8">
    <circle cx="80" cy="90" r="1.8"/>
    <circle cx="140" cy="150" r="1.4"/>
    <circle cx="390" cy="110" r="1.8"/>
    <circle cx="440" cy="170" r="1.5"/>
    <circle cx="70" cy="310" r="1.2"/>
    <circle cx="450" cy="300" r="1.4"/>
  </g>

  <rect width="512" height="512" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <g transform="translate(32, 42)">
    <rect width="100" height="24" rx="12" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="50" y="16" fill="#10b981" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">100 BPM</text>
  </g>
  <g transform="translate(380, 42)">
    <rect width="100" height="24" rx="12" fill="rgba(56, 189, 248, 0.12)" stroke="#38bdf8" stroke-width="1"/>
    <text x="50" y="16" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="1">AMBIENT</text>
  </g>

  <g transform="translate(32, 462)">
    <text x="0" y="0" fill="#67e8f9" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900" letter-spacing="1.5">ACOUSTIC HARMONY</text>
    <text x="0" y="20" fill="rgba(248, 250, 252, 0.7)" font-family="monospace" font-size="11" font-weight="500" letter-spacing="1">AMBIENT VIBES // STEM 03</text>
  </g>
</svg>